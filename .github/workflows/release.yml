name: Publish release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  package:
    name: Package Windows ${{ matrix.architecture }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
        include:
          - architecture: x64
            msvc-arch: amd64
          - architecture: arm64
            msvc-arch: amd64_arm64
    steps:
      - uses: actions/checkout@v6
      - name: Select Windows SDK 10.0.22621.0
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
          sdk: 10.0.22621.0
      - name: Package portable executable
        run: cargo run -p xtask -- portable ${{ matrix.architecture }} dist
      - name: Upload unsigned portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: AutomaticScreenCamera-windows-${{ matrix.architecture }}-unsigned
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish unsigned release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download portable artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: AutomaticScreenCamera-windows-*-unsigned
          merge-multiple: true
          path: release-assets
      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/*.exe \
            release-assets/*.sha256 \
            --target "$GITHUB_SHA" \
            --generate-notes
