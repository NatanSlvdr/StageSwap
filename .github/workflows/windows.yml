name: Publish Windows x64 release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Select Windows SDK 10.0.22621.0
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          sdk: 10.0.22621.0
      - name: Restore latest release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force release-history | Out-Null
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          foreach ($release in $releases) {
            $details = gh release view $release.tagName --json assets | ConvertFrom-Json
            $versionedSidecars = @($details.assets | Where-Object {
              $_.name -like 'StageSwap_win64_v*.exe.sha256'
            })
            if ($versionedSidecars.Count -eq 0) { continue }
            gh release download $release.tagName `
              --pattern 'StageSwap_win64_v*.exe.sha256' `
              --dir release-history `
              --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            break
          }
      - name: Test and package x64
        shell: pwsh
        env:
          STAGESWAP_RELEASE_HISTORY: release-history
        run: |
          cargo test --workspace --all-targets --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run -p xtask -- package x64 dist
      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v7
        with:
          name: StageSwap-win64-unsigned
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish unsigned release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: StageSwap-win64-unsigned
          path: release-assets
      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          release_tag="build-$short_sha"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release view "$release_tag" --json assets --jq '.assets[].name' |
              while read -r asset; do
                case "$asset" in
                  *.exe|*.sha256) gh release delete-asset "$release_tag" "$asset" --yes ;;
                esac
              done
            gh release upload "$release_tag" \
              release-assets/*.exe \
              release-assets/*.sha256 \
              --clobber
          else
            gh release create "$release_tag" \
              release-assets/*.exe \
              release-assets/*.sha256 \
              --target "$GITHUB_SHA" \
              --title "StageSwap $short_sha" \
              --generate-notes
          fi
