name: Rust checks and packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  portable-checks:
    name: Portable Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --all-targets
      - name: Dependency audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # quick-xml is used only by Wayland's build-time protocol scanner;
          # the application never parses untrusted XML at runtime.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195

  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            msvc-arch: amd64
          - architecture: arm64
            target: aarch64-pc-windows-msvc
            msvc-arch: amd64_arm64
    steps:
      - uses: actions/checkout@v6
      - name: Select Windows SDK 10.0.22621.0
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
          sdk: 10.0.22621.0
      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Run Windows x64 tests
        if: matrix.architecture == 'x64'
        run: cargo test --workspace --all-targets --target ${{ matrix.target }}
      - name: Package portable executable
        run: cargo run -p xtask -- portable ${{ matrix.architecture }} dist
      - name: Upload unsigned portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: AutomaticScreenCamera-windows-${{ matrix.architecture }}-unsigned
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
