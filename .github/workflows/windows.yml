name: Build, test, and package

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows ${{ matrix.architecture }} ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v6
      - name: Resolve artifact version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $version = '0.1.0'
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Release tags must use a semantic version such as v1.2.3 or v1.2.3-beta.1."
            }
            $version = $Matches.version
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-${{ matrix.architecture }}-${{ matrix.configuration }} -DASC_PACKAGE_VERSION="$env:RELEASE_VERSION" -DASC_SOURCE_REVISION="${{ github.sha }}"
      - name: Build
        run: cmake --build --preset windows-${{ matrix.architecture }}-${{ matrix.configuration }} --parallel
      - name: Test
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/test-results | Out-Null
          ctest --preset windows-${{ matrix.architecture }}-${{ matrix.configuration }} --output-junit "${{ github.workspace }}/out/test-results/windows-${{ matrix.architecture }}-${{ matrix.configuration }}.xml"
      - name: Package unsigned native portable release
        if: matrix.configuration == 'release'
        shell: pwsh
        run: ./scripts/package.ps1 -Architecture ${{ matrix.architecture }} -Version $env:RELEASE_VERSION -SourceRevision "${{ github.sha }}"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.architecture }}-${{ matrix.configuration }}-test-results
          path: out/test-results
          if-no-files-found: warn
      - name: Upload unsigned release executables
        if: matrix.configuration == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: AutomaticScreenCamera-windows-${{ matrix.architecture }}-unsigned
          path: |
            out/package/*.exe
            out/package/*.sha256
          if-no-files-found: error
      - name: Upload Windows application symbols
        if: matrix.configuration == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: AutomaticScreenCamera-windows-${{ matrix.architecture }}-symbols
          path: |
            out/build/windows-${{ matrix.architecture }}-release/src/windows/Release/*.pdb
            out/build/windows-${{ matrix.architecture }}-release/src/windows/media_source/Release/*.pdb
          if-no-files-found: error
      - name: Upload Windows verification tools
        if: matrix.configuration == 'release' && matrix.architecture == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: AutomaticScreenCamera-windows-x64-verification-tools
          path: |
            out/build/windows-x64-release/tests/windows/Release/*.exe
            out/build/windows-x64-release/tests/windows/Release/*.pdb
            scripts/collect-release-environment.ps1
            scripts/evaluate-release-gates.ps1
            docs/release-evidence.example.json
          if-no-files-found: error

  portable-sanitizers:
    name: Portable core tests (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake --preset portable-asan
      - name: Build
        run: cmake --build --preset portable-asan --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p out/test-results
          ctest --preset portable-asan --output-junit "${{ github.workspace }}/out/test-results/portable-asan.xml"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-asan-test-results
          path: out/test-results
          if-no-files-found: warn

  portable-thread-sanitizer:
    name: Portable concurrency tests (TSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake --preset portable-tsan
      - name: Build
        run: cmake --build --preset portable-tsan --parallel
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          mkdir -p out/test-results
          ctest --preset portable-tsan --output-junit "${{ github.workspace }}/out/test-results/portable-tsan.xml"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-tsan-test-results
          path: out/test-results
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-build
      - portable-sanitizers
      - portable-thread-sanitizer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows release packages
        uses: actions/download-artifact@v8
        with:
          pattern: AutomaticScreenCamera-windows-*-unsigned
          merge-multiple: true
          path: release-assets
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.exe \
            release-assets/*.sha256 \
            --verify-tag \
            --generate-notes \
            "${prerelease[@]}"
