name: Windows build and core tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package unsigned binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build/src/windows/Release/AutomaticScreenCamera.exe package/
          Copy-Item build/src/windows/media_source/Release/AutomaticScreenCameraSource.dll package/
          Copy-Item scripts/install.ps1,scripts/uninstall.ps1 package/
      - uses: actions/upload-artifact@v4
        with:
          name: AutomaticScreenCamera-windows-x64-unsigned
          path: package

