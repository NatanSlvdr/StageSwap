name: Build, test, and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows x64 ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-x64-${{ matrix.configuration }}
      - name: Build
        run: cmake --build --preset windows-x64-${{ matrix.configuration }} --parallel
      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/test-results | Out-Null
          ctest --preset windows-x64-${{ matrix.configuration }} --output-junit "${{ github.workspace }}/out/test-results/windows-x64-${{ matrix.configuration }}.xml"
      - name: Package unsigned release
        if: matrix.configuration == 'release'
        shell: pwsh
        run: ./scripts/package.ps1 -TestResultsDirectory out/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ matrix.configuration }}-test-results
          path: out/test-results
          if-no-files-found: warn
      - name: Upload unsigned release package
        if: matrix.configuration == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: AutomaticScreenCamera-windows-x64-unsigned
          path: |
            out/package/*.zip
            out/package/*.sha256
          if-no-files-found: error
      - name: Upload Windows verification tools
        if: matrix.configuration == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: AutomaticScreenCamera-windows-x64-verification-tools
          path: |
            out/build/windows-x64-release/tests/windows/Release/*.exe
            out/build/windows-x64-release/tests/windows/Release/*.pdb
            scripts/collect-release-environment.ps1
            scripts/evaluate-release-gates.ps1
            docs/release-evidence.example.json
          if-no-files-found: error

  portable-sanitizers:
    name: Portable core tests (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset portable-asan
      - name: Build
        run: cmake --build --preset portable-asan --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p out/test-results
          ctest --preset portable-asan --output-junit "${{ github.workspace }}/out/test-results/portable-asan.xml"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-asan-test-results
          path: out/test-results
          if-no-files-found: warn

  portable-thread-sanitizer:
    name: Portable concurrency tests (TSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset portable-tsan
      - name: Build
        run: cmake --build --preset portable-tsan --parallel
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          mkdir -p out/test-results
          ctest --preset portable-tsan --output-junit "${{ github.workspace }}/out/test-results/portable-tsan.xml"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-tsan-test-results
          path: out/test-results
          if-no-files-found: warn
