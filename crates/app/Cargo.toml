[package]
name = "automatic-screen-camera"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Automatic screen and webcam switching virtual camera"

[[bin]]
name = "AutomaticScreenCamera"
path = "src/main.rs"

[lib]
name = "asc_app"
path = "src/lib.rs"

[dependencies]
asc-core = { path = "../core" }
asc-windows = { path = "../windows" }
eframe.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
tempfile = "3"

[package.metadata.winresource]
ProductName = "Automatic Screen Camera"
FileDescription = "Automatic Screen Camera portable application"
OriginalFilename = "AutomaticScreenCamera.exe"
InternalName = "AutomaticScreenCamera"
