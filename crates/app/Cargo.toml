[package]
name = "stageswap"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Automatic camera-to-screen switching for hybrid meetings"

[[bin]]
name = "StageSwap"
path = "src/main.rs"

[lib]
name = "stageswap_app"
path = "src/lib.rs"

[dependencies]
stageswap-core = { path = "../core" }
stageswap-windows = { path = "../windows" }
eframe.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
tempfile = "3"

[package.metadata.winresource]
ProductName = "StageSwap"
FileDescription = "StageSwap application"
OriginalFilename = "StageSwap.exe"
InternalName = "StageSwap"
